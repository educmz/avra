<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Máquina expendedora Avra en 3D</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    #viewer { position: absolute; inset: 0; }
    #viewer canvas { display: block; width: 100%; height: 100%; outline: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewer"></div>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const viewer = document.getElementById("viewer");
    const notify = (status) => window.parent.postMessage({ source: "avra-vending-3d", status }, window.location.origin);

    try {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
      renderer.setClearColor(0xffffff, 0);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.45;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      viewer.appendChild(renderer.domElement);

      const ambient = new THREE.HemisphereLight(0xffffff, 0xd3cabf, 2.8);
      scene.add(ambient);

      const key = new THREE.DirectionalLight(0xffffff, 3.2);
      key.position.set(-3, 6, 7);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.camera.left = -4;
      key.shadow.camera.right = 4;
      key.shadow.camera.top = 5;
      key.shadow.camera.bottom = -3;
      key.shadow.bias = -0.0002;
      scene.add(key);

      const fill = new THREE.DirectionalLight(0xe6edff, 1.5);
      fill.position.set(3, 3, -5);
      scene.add(fill);

      const gltf = await new GLTFLoader().loadAsync("/models/maquina_expendedora_color.glb");
      const machine = gltf.scene;
      const bounds = new THREE.Box3().setFromObject(machine);
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());
      machine.position.set(-center.x, -bounds.min.y, -center.z);
      machine.traverse((object) => {
        if (object.isMesh) {
          object.castShadow = true;
          object.receiveShadow = true;
        }
      });
      scene.add(machine);

      // Sombra suave sin un panel de fondo: se integra con el color de la página.
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.ShadowMaterial({ opacity: 0.18 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.015;
      floor.receiveShadow = true;
      scene.add(floor);

      const targetHeight = size.y * 0.53;
      camera.position.set(size.y * 0.88, size.y * 0.79, size.y * 1.64);
      camera.lookAt(0, targetHeight, 0);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, targetHeight, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = false;
      controls.enableZoom = false; // Evita capturar el scroll de la página.
      controls.minPolarAngle = Math.PI * 0.19;
      controls.maxPolarAngle = Math.PI * 0.81;
      controls.autoRotate = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      controls.autoRotateSpeed = 0.45;
      renderer.domElement.addEventListener("pointerdown", () => {
        controls.autoRotate = false;
      }, { passive: true });

      const resize = () => {
        const width = viewer.clientWidth;
        const height = viewer.clientHeight;
        if (!width || !height) return;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      };
      new ResizeObserver(resize).observe(viewer);
      resize();
      controls.update();
      renderer.render(scene, camera);
      notify("ready");

      const render = () => {
        controls.update();
        renderer.render(scene, camera);
      };
      const observer = new IntersectionObserver(([entry]) => {
        renderer.setAnimationLoop(entry.isIntersecting && !document.hidden ? render : null);
      }, { threshold: 0.01 });
      observer.observe(viewer);
      document.addEventListener("visibilitychange", () => {
        renderer.setAnimationLoop(document.hidden ? null : render);
      });
    } catch (error) {
      console.error("No se pudo cargar el modelo 3D de Avra:", error);
      notify("error");
    }
  </script>
</body>
</html>
